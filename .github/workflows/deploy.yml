# Auto-deploy to Fly on every push to main — but only if the tests pass.
#
# The build itself runs on Fly's remote builders (`--remote-only`), so this
# runner never needs Docker. Secrets live in `fly secrets`, not here; the only
# thing CI needs is FLY_API_TOKEN to authenticate the deploy.
#
# Set that up once:
#   1. fly tokens create deploy          # prints a "FlyV1 ..." token
#   2. GitHub repo → Settings → Secrets and variables → Actions → New secret
#      name: FLY_API_TOKEN   value: <the token>

name: deploy

on:
  push:
    branches: [main]

# Never let two deploys overlap; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # searchFiles shells out to ripgrep (fs-browser.ts), matching the runtime
      # image (Dockerfile). GitHub's ubuntu runner doesn't ship it, so without
      # this the fs-browser/search tests fail with empty results.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  deploy:
    needs: test # a red build never reaches the live app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
